<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Gerenciar Produtos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-boxes me-2 text-primary"></i>Produtos
        </h2>
        <button class="btn btn-primary" onclick="novoProduto()" sec:authorize="hasRole('GERENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Produto
        </button>
    </div>

    <div class="collapse mb-4" id="formularioProduto" sec:authorize="hasRole('GERENTE')">
        <div class="card shadow-sm">
            <div class="card-body">
                <form id="produtoForm">
                    <input type="hidden" id="produtoId">
                    <div class="row g-3 mb-3">
                        <div class="col-md-5">
                            <label for="nome" class="form-label fw-medium">Nome do Produto</label>
                            <input type="text" id="nome" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label for="tipo" class="form-label fw-medium">Tipo do Produto</label>
                            <select id="tipo" class="form-select" required>
                                <option value="" disabled selected>Selecione o Tipo</option>
                                <option value="Pizza">Pizza</option>
                                <option value="Lanche">Lanche</option>
                                <option value="Bebida">Bebida</option>
                                <option value="Porção">Porção</option>
                                <option value="Adicional">Adicional</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="preco" class="form-label fw-medium">Preço (R$)</label>
                            <input type="number" id="preco" class="form-control" step="0.01" min="0.01" required>
                        </div>
                    </div>
                    <div class="form-check mb-3">
                        <input type="checkbox" id="ativo" class="form-check-input" checked>
                        <label for="ativo" class="form-check-label">Produto Ativo</label>
                    </div>
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-lg me-1"></i> Salvar
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Nome</th>
                        <th>Tipo</th>
                        <th class="text-end">Preço</th>
                        <th>Ativo</th>
                        <th class="text-end pe-4" sec:authorize="hasRole('GERENTE')">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(produtos)}">
                        <td colspan="5" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum produto cadastrado.
                        </td>
                    </tr>
                    <tr th:each="produto : ${produtos}">
                        <td class="ps-4 fw-medium" th:text="${produto.nome}"></td>
                        <td th:text="${produto.tipo}"></td>
                        <td class="text-end"
                            th:text="${produto.preco != null} ? ${'R$ ' + #numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')} : '-'"></td>
                        <td>
                            <span class="badge" th:classappend="${produto.ativo} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${produto.ativo} ? 'Sim' : 'Não'"></span>
                        </td>
                        <td class="text-end pe-4" sec:authorize="hasRole('GERENTE')">
                            <button class="btn btn-sm btn-outline-primary me-1"
                                    th:data-id="${produto.id}" th:data-nome="${produto.nome}"
                                    th:data-tipo="${produto.tipo}" th:data-preco="${produto.preco}"
                                    th:data-ativo="${produto.ativo}"
                                    onclick="editarProduto(this.dataset)">
                                <i class="bi bi-pencil-fill"></i> Editar
                            </button>
                            <button class="btn btn-sm btn-outline-danger" th:data-id="${produto.id}"
                                    onclick="excluirProduto(this.dataset.id)">
                                <i class="bi bi-trash-fill"></i> Excluir
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_PRODUTOS = '/api/produtos';

        function csrfHeaders() {
            const header = document.querySelector('meta[name="_csrf_header"]').content;
            const token = document.querySelector('meta[name="_csrf"]').content;
            return { 'Content-Type': 'application/json', [header]: token };
        }

        async function enviar(url, method, body) {
            const response = await fetch(url, { method, headers: csrfHeaders(), body: body ? JSON.stringify(body) : null });
            if (response.ok) {
                location.reload();
                return;
            }
            const erro = await response.json().catch(() => ({}));
            alert(erro.message || 'Erro ao processar a operação (' + response.status + ')');
        }

        function abrirFormulario() {
            bootstrap.Collapse.getOrCreateInstance(document.getElementById('formularioProduto'), { toggle: false }).show();
        }

        function novoProduto() {
            document.getElementById('produtoForm').reset();
            document.getElementById('produtoId').value = '';
            abrirFormulario();
        }

        function editarProduto(dados) {
            document.getElementById('produtoId').value = dados.id;
            document.getElementById('nome').value = dados.nome;
            document.getElementById('tipo').value = dados.tipo;
            document.getElementById('preco').value = dados.preco;
            document.getElementById('ativo').checked = dados.ativo === 'true';
            abrirFormulario();
        }

        function excluirProduto(id) {
            if (confirm('Tem certeza que deseja excluir este produto?')) {
                enviar(`${API_PRODUTOS}/${id}`, 'DELETE');
            }
        }

        const produtoForm = document.getElementById('produtoForm');
        if (produtoForm) {
            produtoForm.addEventListener('submit', event => {
                event.preventDefault();
                const id = document.getElementById('produtoId').value;
                const produto = {
                    nome: document.getElementById('nome').value,
                    tipo: document.getElementById('tipo').value,
                    preco: Number(document.getElementById('preco').value),
                    ativo: document.getElementById('ativo').checked
                };
                enviar(id ? `${API_PRODUTOS}/${id}` : API_PRODUTOS, id ? 'PUT' : 'POST', produto);
            });
        }
    </script>

</div>

</body>
</html>
