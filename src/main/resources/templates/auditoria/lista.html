<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Auditoria</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-journal-text me-2 text-primary"></i>Auditoria
        </h2>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Data e hora</th>
                        <th>Usuário</th>
                        <th>Operação</th>
                        <th>Entidade</th>
                        <th>Alterações</th>
                        <th>Justificativa</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(registros)}">
                        <td colspan="6" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum registro de auditoria.
                        </td>
                    </tr>
                    <tr th:each="registro : ${registros}">
                        <td class="ps-4 text-muted text-nowrap"
                            th:text="${#temporals.format(registro.dataHora, 'dd/MM/yyyy HH:mm:ss')}"></td>
                        <td>
                            <span class="fw-medium" th:text="${registro.usuario}"></span>
                            <span class="badge bg-secondary" th:text="${registro.perfil}"></span>
                        </td>
                        <td th:text="${registro.operacao?.descricao}"></td>
                        <td>
                            <span th:text="${registro.entidade}"></span>
                            <small class="d-block text-muted" th:text="${registro.entidadeId}"></small>
                        </td>
                        <td>
                            <div th:each="alteracao : ${registro.alteracoes}" class="small">
                                <strong th:text="${alteracao.campo}"></strong>:
                                <span class="text-danger" th:text="${alteracao.valorAnterior} ?: '-'"></span>
                                <i class="bi bi-arrow-right"></i>
                                <span class="text-success" th:text="${alteracao.valorNovo} ?: '-'"></span>
                            </div>
                        </td>
                        <td th:text="${registro.justificativa} ?: '-'"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(registros)}">
            Total: <strong th:text="${#lists.size(registros)}"></strong> registro(s)
        </div>
    </div>

</div>

</body>
</html>
